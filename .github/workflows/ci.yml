name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ci/github-actions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build backend/Zoo.sln --configuration Release -m:1 -nr:false
      - name: Run unit tests
        run: dotnet test backend/Zoo.Tests/Zoo.Tests.csproj --configuration Release -m:1 -nr:false

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
