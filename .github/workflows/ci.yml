name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ci/github-actions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build backend/Zoo.sln --configuration Release -m:1 -nr:false
      - name: Run unit tests
        run: dotnet test backend/Zoo.Tests/Zoo.Tests.csproj --configuration Release --filter 'Category!=SQL&Category!=API'

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  integration:
    name: SQL Server, HTTP API and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'ZooCi_Only!2026'
        ports:
          - 1433/tcp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Wait for SQL Server
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          for attempt in {1..30}; do
            if docker exec "$SQL_CONTAINER" bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -l 2 -b -Q "SELECT 1"' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$SQL_CONTAINER"
          exit 1
      - name: Build backend and browser test host
        id: build
        run: dotnet build backend/Zoo.Tests.BrowserHost/Zoo.Tests.BrowserHost.csproj --configuration Release -m:1 -nr:false
      - name: Run SQL and API tests
        env:
          ZOO_TEST_SQL: "Server=127.0.0.1,${{ job.services.sqlserver.ports['1433'] }};User ID=sa;Password=ZooCi_Only!2026;TrustServerCertificate=True"
        run: dotnet test backend/Zoo.Tests/Zoo.Tests.csproj --configuration Release --no-build --filter 'Category=SQL|Category=API' --logger 'trx;LogFileName=integration.trx' --results-directory "${{ runner.temp }}/zoo-test-results"
      - name: Run Playwright
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: web
        env:
          ZOO_E2E_SQL: "Server=127.0.0.1,${{ job.services.sqlserver.ports['1433'] }};Database=ZooCi_Browser;User ID=sa;Password=ZooCi_Only!2026;TrustServerCertificate=True"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload integration reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: |
            ${{ runner.temp }}/zoo-test-results
            web/playwright-report
          if-no-files-found: ignore
